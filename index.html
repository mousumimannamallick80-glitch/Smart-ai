<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 15px;
    }

    .chat {
      background: white;
      height: 65vh;
      overflow-y: auto;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 3px 12px #0002;
    }

    .message {
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 15px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #dbeafe;
      margin-left: auto;
    }

    .ai {
      background: #e2e8f0;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(.97);
    }

    .clear {
      width: 100%;
      margin-top: 10px;
      background: #64748b;
    }
  </style>
</head>

<body>

  <div class="header">
    🤖 Smart AI
  </div>

      </div>
    </div>
