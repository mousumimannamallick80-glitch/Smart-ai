
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .chat {
      height: calc(100vh - 140px);
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }

    .ai {
      background: white;
      color: #111827;
      margin-right: auto;
      box-shadow: 0 2px 8px #0001;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 10px;
      display: flex;
      gap: 8px;
      box-shadow: 0 -2px 10px #0002;
    }

    #question {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 0 18px;
      border-radius: 12px;
      font-size: 16px;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>
